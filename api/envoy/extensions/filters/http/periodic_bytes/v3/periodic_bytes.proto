syntax = "proto3";

package envoy.extensions.filters.http.periodic_bytes.v3;

import "google/protobuf/duration.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.periodic_bytes.v3";
option java_outer_classname = "PeriodicBytesProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/periodic_bytes/v3;periodic_bytesv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Periodic Bytes]
// [#extension: envoy.filters.http.periodic_bytes]

message PeriodicBytes {
  // Interval between data chunks. Must be > 0.
  google.protobuf.Duration interval = 1 [(validate.rules).duration = {
    required: true,
    gt {}
  }];

  // Number of bytes to send per interval. Must be > 0.
  uint32 response_bytes = 2 [(validate.rules).uint32 = {gt: 0}];
}
